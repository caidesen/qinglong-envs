version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/sql/*.sql"
    schema: "internal/db/schema/latest.sql"
    gen:
      go:
        package: "queries"
        out: "internal/db/queries"
        emit_json_tags: true
        json_tags_case_style: camel
        emit_result_struct_pointers: true
        initialisms:
          - "id"
          - "uid"