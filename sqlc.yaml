version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/sql/*.sql"
    schema: "internal/db/schema/latest.sql"
    gen:
      go:
        package: "queries"
        out: "internal/db/queries"
        sql_package: ""
        json_tags_case_style: camel
        emit_result_struct_pointers: true
        emit_json_tags: true
        initialisms:
          - "id"
          - "uid"
        overrides:
          - column: "*.id"
            go_struct_tag: json:"id,string"
          - db_type: "INTEGER"
            go_type: "int"
          - db_type: "integer"
            go_type: "int"